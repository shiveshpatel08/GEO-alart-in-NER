version: "3.9"

services:
  # ─── FastAPI Application ─────────────────────────────────────────────────────
  api:
    build: .
    container_name: geoalert_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgis:5432/geoalert_ner
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgis:5432/geoalert_ner
      REDIS_URL: redis://redis:6379
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/models_ml:/app/app/models_ml

  # ─── PostGIS (PostgreSQL + PostGIS Extension) ────────────────────────────────
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: geoalert_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: geoalert_ner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geoalert_ner"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: geoalert_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgis_data:
